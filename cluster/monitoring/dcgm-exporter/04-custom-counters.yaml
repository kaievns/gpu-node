# Custom DCGM counter set — the exporter's default set PLUS the throttle /
# violation telemetry this box actually needs.
#
# Why: the entire Xid 79 saga on this card was GDDR6X memory-junction
# heat-soak, whose *only* software-visible signature is the SW Thermal
# Slowdown bit (0x20) in the clock-event-reason bitmask firing while the die
# temp is a comfortable 65-70°C. DCGM_FI_DEV_MEMORY_TEMP reads a constant 0
# on consumer Ampere (NVML doesn't expose memory junction there), so without
# CLOCKS_EVENT_REASONS + the violation counters, the dashboard is blind to
# the exact failure mode this machine is known for.
#
# Mounted over the exporter's default CSV via DCGM_EXPORTER_COLLECTORS in
# 02-daemonset.yaml. NOTE: a custom CSV REPLACES the default set, so the
# default counters are repeated here in full (minus the useless
# DCGM_FI_DEV_VGPU_LICENSE_STATUS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-counters
  namespace: gpu-node-system
  labels:
    app.kubernetes.io/name: dcgm-exporter
data:
  counters.csv: |
    # ---- default set (kept) ----
    # Clocks
    DCGM_FI_DEV_SM_CLOCK,                gauge,   SM clock frequency (MHz)
    DCGM_FI_DEV_MEM_CLOCK,               gauge,   Memory clock frequency (MHz)
    # Temperature
    DCGM_FI_DEV_GPU_TEMP,                gauge,   GPU die temperature (C)
    DCGM_FI_DEV_MEMORY_TEMP,             gauge,   Memory junction temperature (C) - constant 0 on consumer Ampere, kept in case of a future card
    # Power
    DCGM_FI_DEV_POWER_USAGE,             gauge,   Power draw (W)
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since driver load (mJ)
    # Utilization
    DCGM_FI_DEV_GPU_UTIL,                gauge,   GPU (SM) utilization (%)
    DCGM_FI_DEV_MEM_COPY_UTIL,           gauge,   Memory bandwidth utilization (%)
    DCGM_FI_DEV_ENC_UTIL,                gauge,   NVENC encoder utilization (%)
    DCGM_FI_DEV_DEC_UTIL,                gauge,   NVDEC decoder utilization (%)
    # Framebuffer
    DCGM_FI_DEV_FB_FREE,                 gauge,   Framebuffer free (MiB)
    DCGM_FI_DEV_FB_USED,                 gauge,   Framebuffer used (MiB)
    DCGM_FI_DEV_FB_RESERVED,             gauge,   Framebuffer reserved (MiB)
    # Reliability
    DCGM_FI_DEV_XID_ERRORS,              gauge,   Most recent Xid error code (0 = none)
    DCGM_FI_DEV_PCIE_REPLAY_COUNTER,     counter, PCIe bus retry/replay count
    # ---- additions: throttle + violation telemetry ----
    # Bitmask of active clock-event reasons. The one that matters here:
    # 0x20 = SW Thermal Slowdown — on this card that bit firing at die temp
    # <70C means GDDR6X memory-junction heat-soak (the Xid 79 signature).
    DCGM_FI_DEV_CLOCKS_EVENT_REASONS,    gauge,   Active clock-event (throttle) reason bitmask
    # Performance state: 0=P0 (max perf), 2=P2 (CUDA compute pstate - memory
    # clock capped at 9251 MHz on this card by design, see docs).
    DCGM_FI_DEV_PSTATE,                  gauge,   GPU performance state (P-state)
    # Cumulative microseconds spent throttled, by cause.
    DCGM_FI_DEV_POWER_VIOLATION,         counter, Throttle time due to power cap (us)
    DCGM_FI_DEV_THERMAL_VIOLATION,       counter, Throttle time due to thermal limits (us)
    DCGM_FI_DEV_BOARD_LIMIT_VIOLATION,   counter, Throttle time due to board limit (us)
    DCGM_FI_DEV_RELIABILITY_VIOLATION,   counter, Throttle time due to reliability limit (us)
