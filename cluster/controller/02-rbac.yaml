apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-controller
  namespace: gpu-node-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-controller
rules:
  # Manage taints on gpu-node (and read its conditions/status)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Read pending/running pods to decide when to flip modes
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-node-controller
subjects:
  - kind: ServiceAccount
    name: gpu-node-controller
    namespace: gpu-node-system
