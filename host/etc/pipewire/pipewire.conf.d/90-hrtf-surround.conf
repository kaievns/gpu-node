# 7.1 -> stereo downmix for headphone streaming (NO HRTF).
#
# games (auto-routed to 7.1 Surround_HRTF) -> ITU-R BS.775 channel-coefficient
# stereo downmix -> BinauralBus (stereo null sink) -> Sunshine -> Opus -> Deck.
#
# Design notes (v5, 2026-05-21):
#  - HRTF removed entirely. Earlier HRTF iterations (v1-v4) introduced
#    'jar/underwater' coloration (KEMAR HRIR midrange dip + HF rolloff),
#    'too wide' soundstage (exaggerated angles), and crucially BROKEN
#    DISTANCE PERCEPTION (games encode distance via level + HF air
#    absorption; HRIR's own HF rolloff + level shifts compressed those
#    cues so far-away enemies sounded close).
#  - Pure stereo downmix preserves the game's native amplitude-encoded
#    distance cues + tonal balance. No spatial cues from rear/side
#    channels (they fold into L/R), but the trade-off favours natural
#    sound for headphone use.
#  - Coefficients per ITU-R BS.775 (scaled down globally to avoid
#    correlated-channel summation clipping):
#      L = 0.40*FL + 0.30*FC + 0.20*LFE + 0.20*RL + 0.30*SL
#      R = 0.40*FR + 0.30*FC + 0.20*LFE + 0.20*RR + 0.30*SR
#    Worst-case correlated peak ~ +3 dB, well within typical headroom.
#  - Sink name retained as Surround_HRTF for backwards compat with games
#    that have already auto-routed there.
#  - node.latency = 256/48000 on capture (5.3 ms quantum) for low lag.
#
# Priorities: Surround_HeSuVi (3000, from 91-hesuvi-surround.conf) is the
# system default; BinauralBus (2000) is the bus Sunshine captures;
# Surround_HRTF here sits at 50 — but it's what games actually get, because
# gamescope-headless.sh pins the session with PULSE_SINK=Surround_HRTF.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "BinauralBus"
      node.description = "Binaural Bus (to Sunshine)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      priority.session = 2000
      node.always-process = true
    }
  }
]
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "7.1 Stereo Downmix"
      media.name       = "7.1 Stereo Downmix"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = cp_fc }
          { type = builtin label = copy name = cp_lfe }
          # L mixer:  In1=FL  In2=FC  In3=LFE  In4=RL  In5=SL
          { type = builtin label = mixer name = mix_l control = { "Gain 1" = 0.40 "Gain 2" = 0.30 "Gain 3" = 0.20 "Gain 4" = 0.20 "Gain 5" = 0.30 } }
          # R mixer:  In1=FR  In2=FC  In3=LFE  In4=RR  In5=SR
          { type = builtin label = mixer name = mix_r control = { "Gain 1" = 0.40 "Gain 2" = 0.30 "Gain 3" = 0.20 "Gain 4" = 0.20 "Gain 5" = 0.30 } }
        ]
        links = [
          { output = "cp_fc:Out"  input = "mix_l:In 2" }
          { output = "cp_fc:Out"  input = "mix_r:In 2" }
          { output = "cp_lfe:Out" input = "mix_l:In 3" }
          { output = "cp_lfe:Out" input = "mix_r:In 3" }
        ]
        # Channel order matches audio.position FL FR FC LFE RL RR SL SR.
        # FC and LFE fan out via copy nodes -> both mixers; others go to
        # their side's mixer only.
        inputs  = [ "mix_l:In 1" "mix_r:In 1" "cp_fc:In" "cp_lfe:In" "mix_l:In 4" "mix_r:In 4" "mix_l:In 5" "mix_r:In 5" ]
        outputs = [ "mix_l:Out" "mix_r:Out" ]
      }
      capture.props = {
        node.name        = "Surround_HRTF"
        node.description = "7.1 Stereo Downmix"
        media.class      = Audio/Sink
        audio.channels   = 8
        audio.position   = [ FL FR FC LFE RL RR SL SR ]
        priority.session = 50
        node.latency     = 256/48000
      }
      playback.props = {
        node.name      = "hrtf_binaural_out"
        node.passive   = true
        target.object  = "BinauralBus"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
