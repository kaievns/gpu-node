# HeSuVi virtual surround sink — OpenAL Soft impulse responses (oal+++.wav,
# the highest-rated HeSuVi preset per community consensus for natural
# tonality + best 3D positioning).
#
# Architecture:
#   game (7.1) -> Surround_HeSuVi (priority 3000 = system default)
#     -> 14 mono convolvers (one per HeSuVi-channel-to-ear IR)
#     -> mix_l + mix_r summers (LFE bypassed direct, non-spatial bass)
#     -> hesuvi_binaural_out -> BinauralBus -> Sunshine -> Opus -> Deck.
#
# Routing strategy on this box:
#   - Surround_HeSuVi (priority 3000) = system default for anything not
#     otherwise pinned. HeSuVi convolution applied here. NEVER stack
#     engine HRTF + system HRTF.
#   - BinauralBus (priority 2000) = the pure-stereo bus Sunshine captures
#     (audio_sink = BinauralBus); both filter-chains terminate here.
#   - Surround_HRTF (priority 50, from 90-hrtf-surround.conf) = pure 7.1->
#     stereo ITU BS.775 downmix (legacy name, no HRTF). The gamescope
#     session pins PULSE_SINK=Surround_HRTF, so games launched inside it
#     land here today; per-game PULSE_SINK launch options override.
#
# HeSuVi 14-channel WAV convention (per HeSuVi docs):
#   ch 0-1: FL→L,R    ch 2-3: SL→L,R    ch 4-5: RL→L,R
#   ch 6-7: FC→L,R    ch 8-9: FR→L,R    ch 10-11: SR→L,R    ch 12-13: RR→L,R
# (FC is in the middle, not at the start — HeSuVi convention)
#
# LFE has no spatial IR in HeSuVi (non-directional bass) — we route LFE
# direct to mix_l + mix_r at -8 dB gain. HeSuVi IRs are normalized to be
# summed at unity, so per-convolver gain stays at 1.0 / mixer summing at
# unity. If it clips on correlated content, dial mix gains down to 0.5.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "HeSuVi Surround (OpenAL Soft IR)"
      media.name       = "HeSuVi Surround (OpenAL Soft IR)"
      filter.graph = {
        nodes = [
          # fanout copy nodes — each input channel needs to feed BOTH its
          # L-ear and R-ear convolvers, so fan out via copy:Out → 2 inputs
          { type = builtin label = copy name = cp_fl  }
          { type = builtin label = copy name = cp_fr  }
          { type = builtin label = copy name = cp_fc  }
          { type = builtin label = copy name = cp_lfe }
          { type = builtin label = copy name = cp_rl  }
          { type = builtin label = copy name = cp_rr  }
          { type = builtin label = copy name = cp_sl  }
          { type = builtin label = copy name = cp_sr  }
          # 14 mono convolvers — one per HeSuVi-channel-to-ear IR
          { type = builtin label = convolver name = cv_fl_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fl_l.wav" } }
          { type = builtin label = convolver name = cv_fl_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fl_r.wav" } }
          { type = builtin label = convolver name = cv_fr_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fr_l.wav" } }
          { type = builtin label = convolver name = cv_fr_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fr_r.wav" } }
          { type = builtin label = convolver name = cv_fc_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fc_l.wav" } }
          { type = builtin label = convolver name = cv_fc_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_fc_r.wav" } }
          { type = builtin label = convolver name = cv_rl_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_rl_l.wav" } }
          { type = builtin label = convolver name = cv_rl_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_rl_r.wav" } }
          { type = builtin label = convolver name = cv_rr_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_rr_l.wav" } }
          { type = builtin label = convolver name = cv_rr_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_rr_r.wav" } }
          { type = builtin label = convolver name = cv_sl_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_sl_l.wav" } }
          { type = builtin label = convolver name = cv_sl_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_sl_r.wav" } }
          { type = builtin label = convolver name = cv_sr_l config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_sr_l.wav" } }
          { type = builtin label = convolver name = cv_sr_r config = { filename = "/etc/pipewire/hrtf/hesuvi/ir_sr_r.wav" } }
          # summers — In 1-7 are convolved channels, In 8 is LFE bypass
          { type = builtin label = mixer name = mix_l control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 "Gain 8" = 0.40 } }
          { type = builtin label = mixer name = mix_r control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 1.0 "Gain 5" = 1.0 "Gain 6" = 1.0 "Gain 7" = 1.0 "Gain 8" = 0.40 } }
        ]
        links = [
          # fan out each input copy to its 2 convolvers
          { output = "cp_fl:Out"  input = "cv_fl_l:In" }  { output = "cp_fl:Out"  input = "cv_fl_r:In" }
          { output = "cp_fr:Out"  input = "cv_fr_l:In" }  { output = "cp_fr:Out"  input = "cv_fr_r:In" }
          { output = "cp_fc:Out"  input = "cv_fc_l:In" }  { output = "cp_fc:Out"  input = "cv_fc_r:In" }
          { output = "cp_rl:Out"  input = "cv_rl_l:In" }  { output = "cp_rl:Out"  input = "cv_rl_r:In" }
          { output = "cp_rr:Out"  input = "cv_rr_l:In" }  { output = "cp_rr:Out"  input = "cv_rr_r:In" }
          { output = "cp_sl:Out"  input = "cv_sl_l:In" }  { output = "cp_sl:Out"  input = "cv_sl_r:In" }
          { output = "cp_sr:Out"  input = "cv_sr_l:In" }  { output = "cp_sr:Out"  input = "cv_sr_r:In" }
          # mix L-ear convolver outputs into mix_l
          { output = "cv_fl_l:Out" input = "mix_l:In 1" }
          { output = "cv_fr_l:Out" input = "mix_l:In 2" }
          { output = "cv_fc_l:Out" input = "mix_l:In 3" }
          { output = "cv_rl_l:Out" input = "mix_l:In 4" }
          { output = "cv_rr_l:Out" input = "mix_l:In 5" }
          { output = "cv_sl_l:Out" input = "mix_l:In 6" }
          { output = "cv_sr_l:Out" input = "mix_l:In 7" }
          { output = "cp_lfe:Out"  input = "mix_l:In 8" }
          # mix R-ear convolver outputs into mix_r
          { output = "cv_fl_r:Out" input = "mix_r:In 1" }
          { output = "cv_fr_r:Out" input = "mix_r:In 2" }
          { output = "cv_fc_r:Out" input = "mix_r:In 3" }
          { output = "cv_rl_r:Out" input = "mix_r:In 4" }
          { output = "cv_rr_r:Out" input = "mix_r:In 5" }
          { output = "cv_sl_r:Out" input = "mix_r:In 6" }
          { output = "cv_sr_r:Out" input = "mix_r:In 7" }
          { output = "cp_lfe:Out"  input = "mix_r:In 8" }
        ]
        inputs  = [ "cp_fl:In" "cp_fr:In" "cp_fc:In" "cp_lfe:In" "cp_rl:In" "cp_rr:In" "cp_sl:In" "cp_sr:In" ]
        outputs = [ "mix_l:Out" "mix_r:Out" ]
      }
      capture.props = {
        node.name        = "Surround_HeSuVi"
        node.description = "HeSuVi Surround (OpenAL Soft IR)"
        media.class      = Audio/Sink
        audio.channels   = 8
        audio.position   = [ FL FR FC LFE RL RR SL SR ]
        priority.session = 3000
        node.latency     = 256/48000
      }
      playback.props = {
        node.name      = "hesuvi_binaural_out"
        node.passive   = true
        target.object  = "BinauralBus"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
