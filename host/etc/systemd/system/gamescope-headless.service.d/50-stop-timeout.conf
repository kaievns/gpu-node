[Service]
# gamescope's default 90s SIGTERM wait is too long for our agent flip path
# (agent waits 60s on the stop call). Steam state is preserved elsewhere
# (steam-session.service writes config + cache before our session starts),
# so SIGKILL'ing the gamescope session at 20s is safe — just tears down
# the ephemeral wayland compositor and the in-flight gamepadui process.
TimeoutStopSec=20
