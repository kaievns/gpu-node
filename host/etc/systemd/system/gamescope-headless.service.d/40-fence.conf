# Game sandbox: see docs/architecture.md "Game sandbox".
# The IP fence is on user-1100.slice: PAMName moves ExecStart out of this unit's cgroup.
[Service]
NoNewPrivileges=yes
RestrictSUIDSGID=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=/home/gamer /run/user/1100
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
InaccessiblePaths=-/root -/etc/rancher -/var/lib/rancher -/run/k3s -/var/lib/kubelet -/etc/gaming-agent -/opt/gaming-agent
BindReadOnlyPaths=/etc/gaming-fence/resolv.conf:/etc/resolv.conf
