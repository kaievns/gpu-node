# Game sandbox: see docs/architecture.md "Game sandbox".
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_NICE
RestrictSUIDSGID=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=/home/gamer /run/user/1100
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
InaccessiblePaths=-/root -/etc/rancher -/var/lib/rancher -/run/k3s -/var/lib/kubelet -/etc/gaming-agent -/opt/gaming-agent
IPAddressDeny=any
IPAddressAllow=localhost 172.16.1.0/24 172.20.1.0/24
