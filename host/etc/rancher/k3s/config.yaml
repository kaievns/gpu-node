# k3s agent config — applied on first registration so labels/taints take.
# Node name forced to gpu-node (RFC-1123 ok; differs from static hostname Gameland by user preference).
node-name: "gpu-node"
node-label:
  - "gpu.model=rtx5080"
  - "node.role=gpu-worker"
  - "node.type=dynamic"
node-taint:
  - "gpu=true:NoSchedule"
  - "dynamic-node=true:NoSchedule"
